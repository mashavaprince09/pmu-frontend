# Docker's embedded DNS (127.0.0.11) resolves service names dynamically. Using it with a
# variable in proxy_pass (rather than a bare hostname) makes nginx resolve "backend" lazily
# per-request instead of once at config-load time — a bare hostname there makes nginx refuse
# to start at all if "backend" isn't resolvable yet when the frontend container boots.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: fall back to index.html for any non-file path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (same Docker network, service name "backend").
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for live metrics.
    location /ws/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
